<!DOCTYPE html>
<html lang="ru">
<head>

<title>TLoffice</title>
<style>
:root{--bg:#f4f3ee;--sf:#fff;--tx:#1d1c1a;--mu:#6d6a62;--bd:#dcd9cf;--ac:#2f5fd0;--ac2:#e6edfb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--sf:#222226;--tx:#ecebe6;--mu:#9a978f;--bd:#37373d;--ac:#7ea0ff;--ac2:#2a3350}}
:root[data-theme="dark"]{--bg:#17171a;--sf:#222226;--tx:#ecebe6;--mu:#9a978f;--bd:#37373d;--ac:#7ea0ff;--ac2:#2a3350}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:5px 9px}
button,.btn{cursor:pointer}button:hover,.btn:hover{border-color:var(--ac)}
.on{background:var(--ac2)!important;border-color:var(--ac)!important}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:5px 9px;background:var(--sf)}
header{display:flex;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--bd);background:var(--sf);flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0}
#st{color:var(--mu);margin-left:auto;font-size:13px}
.view{display:none;flex:1;min-height:0}.view.on{display:flex;background:none;border:0}
aside{width:270px;overflow:auto;border-right:1px solid var(--bd);padding:12px;background:var(--sf);box-sizing:border-box}
aside h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.row{display:flex;gap:4px}.row input{flex:1;min-width:0}
.li{display:flex;justify-content:space-between;gap:6px;padding:5px 6px;border-radius:6px;cursor:pointer}
.li:hover,.it:hover{background:var(--ac2)}.li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li b{color:var(--mu)}
.it{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 6px;font-size:13px}
.mu{color:var(--mu)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:8px;border-bottom:1px solid var(--bd);background:var(--sf)}
.bar input[type=number]{width:56px}.bar .sp{width:1px;height:22px;background:var(--bd);margin:0 4px}
#stage{flex:1;overflow:auto;padding:20px;text-align:center}
#empty{margin-top:15vh;color:var(--mu)}
.pgw{position:relative;margin:0 auto 14px;box-shadow:0 2px 14px rgba(0,0,0,.25);background:#fff;line-height:0}
.pgw canvas{display:block}.ov{position:absolute;inset:0;touch-action:none;pointer-events:none}.draw .ov{pointer-events:auto;cursor:crosshair}
.nl{position:absolute;inset:0;pointer-events:none}
.note{position:absolute;pointer-events:auto;background:#fff3a3;border:1px solid #d9c34a;border-radius:6px;width:160px;line-height:1.3;box-shadow:0 2px 6px rgba(0,0,0,.3);text-align:left}
.note textarea{width:100%;height:64px;border:0;background:transparent;color:#222;font:12px system-ui;box-sizing:border-box;resize:both}
.note b{cursor:pointer;float:right;padding:0 7px;color:#555}
#pw{flex:1;overflow:auto;padding:20px}
#ed{margin:0 auto;background:#fff;color:#111;width:210mm;min-height:297mm;box-sizing:border-box;outline:none;box-shadow:0 2px 14px rgba(0,0,0,.25)}
#ed img{max-width:100%}
#v-study{overflow:auto;padding:20px;gap:16px;flex-wrap:wrap;align-content:flex-start}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:18px;width:340px;box-sizing:border-box}
.card h3{margin:0 0 12px;font-size:15px}
#tm{font-size:54px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.fc{min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;margin-bottom:10px;white-space:pre-wrap}
.fc.fl{background:var(--ac2)}
.tk{display:flex;gap:8px;align-items:center;padding:4px 0}.tk span:nth-child(2){flex:1}.late{color:#d23}.done{text-decoration:line-through;color:var(--mu)}
.card .row{margin-top:8px}.card input[type=text]{width:100%;box-sizing:border-box}
#logo{display:flex;align-items:baseline;gap:8px;cursor:pointer;margin-right:14px;user-select:none}
.lg{font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--ac)}#logo small{font-size:11.5px;color:var(--mu)}
.home{flex:1;overflow:auto;padding:32px 24px}.home>*{max-width:920px;margin-left:auto;margin-right:auto}.home h2{margin:0 auto 4px;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:20px!important}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px;border-radius:12px;font-size:28px;line-height:1.2}
.cat b{font-size:15px}.cat span{font-size:13px;color:var(--mu)}.cat:hover{background:var(--ac2)}
#ed img.sel{outline:2px solid #2f5fd0}.lgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px!important}
</style>
</head>
<body>
<header>
<div id="logo" role="button" tabindex="0" title="На главную"><span class="lg">TLoffice</span><small>Narek Tech Lab</small></div>
<button class="tab on" data-v="home">Домой</button>
<button class="tab" data-v="read">Читалка PDF</button>
<button class="tab" data-v="doc">Бланки</button>
<button class="tab" data-v="study">Учёба</button>
<span id="st"></span>
<button id="bk" title="Резервная копия: заметки, документы, карточки (без самих PDF)">Копия</button>
<label class="btn" title="Восстановить из копии">Восстановить<input id="bi" type="file" accept=".json" hidden></label>
<button id="th">Тема</button>
</header>

<section id="v-home" class="view on"><div class="home">
<h2>Что будем делать?</h2><p class="mu">Выберите категорию</p>
<div id="lgs" class="lgs"></div>
<div class="grid">
<button class="cat" data-go="read">📖<b>Читалка PDF</b><span>Книги и статьи: все страницы, заметки, маркер, поиск</span></button>
<button class="cat" data-go="doc">📝<b>Мои документы</b><span>Редактор как в Word, скачать .docx и PDF</span></button>
<button class="cat" data-new="gost">🎓<b>Реферат по ГОСТу</b><span>Титульный лист и поля по стандарту</span></button>
<button class="cat" data-new="notes">🗒️<b>Конспект лекции</b><span>Готовая структура для записей</span></button>
<button class="cat" data-new="letter">✉️<b>Заявление / письмо</b><span>Деловой бланк</span></button>
<button class="cat" data-new="blank">📄<b>Пустой лист</b><span>Чистый документ</span></button>
<button class="cat" data-go="study" data-at="tm">⏱️<b>Помодоро</b><span>Таймер 25 / 5 минут</span></button>
<button class="cat" data-go="study" data-at="cd">🃏<b>Карточки</b><span>Вопрос и ответ для запоминания</span></button>
<button class="cat" data-go="study" data-at="tl">✅<b>Задачи и дедлайны</b><span>Что и к какому сроку</span></button>
</div></div></section>

<section id="v-read" class="view">
<aside>
<label class="btn pri">+ Добавить PDF<input id="up" type="file" accept="application/pdf" multiple hidden></label>
<h4>Библиотека</h4><div id="lib"></div>

<h4>Оглавление</h4><div id="toc"><span class="mu">Откройте книгу</span></div>
<h4>Закладки <button id="bma">+ эта страница</button></h4><div id="bms"></div>

<div class="main">
<div class="bar">

<input type="color" id="pc" value="#d93025" title="Цвет пера">
<button id="un">Отменить</button><button id="cl">Очистить стр.</button>

<div id="stage"><div id="empty">Добавьте PDF слева — книгу или статью. Она сохранится в браузере.</div>
<div id="pages"></div></div>
</div>
</section>

<section id="v-doc" class="view">
<div class="main">
<div class="bar">
<select id="ds" title="Документы"></select><input id="dn" placeholder="Название" style="width:150px">
<select id="nt"><option value="">+ Новый…</option><option value="blank">Пустой лист</option><option value="gost">Реферат по ГОСТу</option><option value="notes">Конспект лекции</option><option value="letter">Заявление / письмо</option></select>
<button id="dd">Удалить</button>
<span class="sp"></span>
<button id="xd" class="pri">Скачать .docx</button><button id="xp" class="pri">Скачать PDF</button>
</div>
<div class="bar">
<button data-c="undo">↶</button><button data-c="redo">↷</button><span class="sp"></span>
<select id="fb"><option value="p">Обычный</option><option value="h1">Заголовок 1</option><option value="h2">Заголовок 2</option><option value="h3">Заголовок 3</option><option value="blockquote">Цитата</option></select>
<select id="ff"><option>Calibri</option><option>Arial</option><option>Times New Roman</option><option>Georgia</option><option>Courier New</option><option>Verdana</option></select>

<span class="sp"></span>
<button data-c="bold"><b>Ж</b></button><button data-c="italic"><i>К</i></button><button data-c="underline"><u>Ч</u></button><button data-c="strikeThrough"><s>З</s></button>
<input type="color" id="fc" value="#000000" title="Цвет текста"><input type="color" id="hc" value="#ffee00" title="Выделение цветом">
<span class="sp"></span>
<button data-c="justifyLeft">⇤</button><button data-c="justifyCenter">↔</button><button data-c="justifyRight">⇥</button><button data-c="justifyFull">≡</button>
<button data-c="insertUnorderedList">• Список</button><button data-c="insertOrderedList">1. Список</button><button data-c="outdent">⇠</button><button data-c="indent">⇢</button>
<span class="sp"></span>
<input id="tr" type="number" min="1" value="3" style="width:50px" title="Строк"><input id="tc" type="number" min="1" value="3" style="width:50px" title="Столбцов"><button id="tb">Таблица</button>
<label class="btn pri">🖼 Фото<input id="im" type="file" accept="image/*" multiple hidden></label><span class="mu">Размер фото:</span><button data-ip="25">25%</button><button data-ip="50">50%</button><button data-ip="75">75%</button><button data-ip="100">100%</button><button id="idl">🗑</button>
<button id="pb">Разрыв стр.</button><button data-c="removeFormat">Сбросить</button>
</div>
<div id="pw"><div id="ed" contenteditable="true" spellcheck="true"></div></div>
</div>
</section>

<section id="v-study" class="view">

<div class="row"><input type="text" id="ca" placeholder="Вопрос"></div><div class="row"><input type="text" id="cb" placeholder="Ответ"><button id="cn">Добавить</button></div></div>

</section>

$('#ds').onchange=e=>{saveDoc();loadDoc(e.target.value)};
$('#nt').onchange=e=>{if(e.target.value)mk(e.target.value);e.target.value=''};
$('#dn').oninput=e=>{cd().n=e.target.value||'Без названия';LS.s('docs',docs);const o=$('#ds').selectedOptions[0];if(o)o.textContent=cd().n};
arm($('#dd'),()=>{delete docs[did];const k=Object.keys(docs);if(k.length){LS.s('docs',docs);loadDoc(k[0])}else mk('blank')});
if(!docs[did]){const k=Object.keys(docs);k.length?loadDoc(k[0]):mk('blank')}else loadDoc(did);

let sel=null;document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&ED.contains(s.anchorNode))sel=s.getRangeAt(0).cloneRange()});
function ex(c,v){ED.focus();if(sel){const s=getSelection();s.removeAllRanges();s.addRange(sel)}document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,v||null);ED.oninput()}
$$('[data-c]').forEach(b=>b.onclick=()=>ex(b.dataset.c));
$('#fb').onchange=e=>ex('formatBlock','<'+e.target.value+'>');$('#ff').onchange=e=>ex('fontName',e.target.value);$('#fs').onchange=e=>ex('fontSize',e.target.value);
$('#fc').oninput=e=>ex('foreColor',e.target.value);$('#hc').oninput=e=>ex('hiliteColor',e.target.value);
$('#pb').onclick=()=>ex('insertHTML',BR+'<p><br></p>');
$('#tb').onclick=()=>{const r=+$('#tr').value||3,c=+$('#tc').value||3;let h='<table style="border-collapse:collapse;width:100%">';for(let i=0;i<r;i++){h+='<tr>';for(let j=0;j<c;j++)h+='<td style="border:1px solid #444;padding:4px">&nbsp;</td>';h+='</tr>'}ex('insertHTML',h+'</table><p><br></p>')};
function addImg(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ex('insertImage',c.toDataURL(f.type==='image/png'?'image/png':'image/jpeg',.85));res()};im.onerror=res;im.src=r.result};r.readAsDataURL(f)})}
async function addImgs(fs){for(const f of fs)if(/^image\//.test(f.type))await addImg(f)}
$('#im').onchange=async e=>{await addImgs(e.target.files);e.target.value=''};
ED.addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.some(f=>/^image\//.test(f.type))){e.preventDefault();addImgs(fs)}});
ED.addEventListener('drop',e=>{const fs=[...(e.dataTransfer?.files||[])];if(fs.some(f=>/^image\//.test(f.type))){e.preventDefault();addImgs(fs)}});
let simg=null;ED.addEventListener('click',e=>{ED.querySelectorAll('img.sel').forEach(i=>i.classList.remove('sel'));simg=e.target.tagName==='IMG'?e.target:null;if(simg)simg.classList.add('sel')});
$$('[data-ip]').forEach(b=>b.onclick=()=>{if(!simg){st('Сначала нажмите на фото');return}const d=cd();simg.style.width=Math.round((210-d.m[1]-d.m[3])*3.78*b.dataset.ip/100)+'px';simg.style.height='auto';ED.oninput()});
$('#idl').onclick=()=>{if(!simg){st('Сначала нажмите на фото');return}simg.remove();simg=null;ED.oninput()};
$('#xd').onclick=()=>{const d=cd(),k=56.7;try{const h='<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><div style="'+d.css+'">'+ED.innerHTML+'</div></body></html>';dl((d.n||'document')+'.docx',htmlDocx.asBlob(h,{margins:{top:d.m[0]*k|0,right:d.m[1]*k|0,bottom:d.m[2]*k|0,left:d.m[3]*k|0}}))}catch(e){st('Не удалось создать .docx')}};
$('#xp').onclick=async()=>{const d=cd(),el=document.createElement('div');el.style.cssText=d.css+'width:'+(210-d.m[1]-d.m[3])+'mm;background:#fff;color:#000;position:fixed;left:-10000px;top:0';el.innerHTML=ED.innerHTML;document.body.appendChild(el);st('Готовлю PDF…');try{const b=await html2pdf().set({margin:[d.m[0],d.m[3],d.m[2],d.m[1]],image:{type:'jpeg',quality:.95},html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4'},pagebreak:{mode:['css','legacy']}}).from(el).outputPdf('blob');await dl((d.n||'document')+'.pdf',b)}catch(e){st('Не удалось создать PDF')}el.remove()};

/* ---------- учёба ---------- */
const pm={left:1500,mode:'Работа',run:false,end:0,iv:0,done:0},fm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function pd(){$('#tm').textContent=fm(pm.left);$('#pm').textContent=tr(pm.mode)+' · '+tr('циклов')+': '+pm.done;$('#ps').textContent=pm.run?'Пауза':'Старт'}
$('#ps').onclick=()=>{if(pm.run){clearInterval(pm.iv);pm.run=false}else{pm.end=Date.now()+pm.left*1000;pm.run=true;pm.iv=setInterval(()=>{pm.left=Math.max(0,Math.round((pm.end-Date.now())/1000));if(!pm.left){clearInterval(pm.iv);pm.run=false;if(pm.mode==='Работа'){pm.done++;pm.mode='Перерыв';pm.left=300;st('Пора отдохнуть 5 минут')}else{pm.mode='Работа';pm.left=1500;st('Перерыв окончен')}}pd()},250)}pd()};
$('#pr').onclick=()=>{clearInterval(pm.iv);pm.run=false;pm.mode='Работа';pm.left=1500;pd()};pd();

let cards=LS.g('cards',[]),ci=0,fl=false;
function cdr(){const c=cards[ci],e=$('#cd');e.textContent=c?(fl?c.b:c.a):'Добавьте первую карточку';e.className='fc'+(fl?' fl':'');$('#cc').textContent=cards.length?(ci+1)+' / '+cards.length:''}
const cm=d=>{if(!cards.length)return;ci=(ci+d+cards.length)%cards.length;fl=false;cdr()};
$('#cd').onclick=()=>{fl=!fl;cdr()};$('#c1').onclick=()=>cm(-1);$('#c2').onclick=()=>cm(1);
$('#cn').onclick=()=>{const a=$('#ca').value.trim(),b=$('#cb').value.trim();if(!a||!b)return;cards.push({a,b});LS.s('cards',cards);ci=cards.length-1;fl=false;$('#ca').value=$('#cb').value='';cdr()};
arm($('#cx'),()=>{cards.splice(ci,1);LS.s('cards',cards);ci=Math.max(0,ci-1);fl=false;cdr()});cdr();

let tasks=LS.g('tasks',[]);
function tdr(){const el=$('#tl'),today=new Date().toLocaleDateString('sv');el.innerHTML=tasks.length?'':'<span class="mu">Задач пока нет</span>';[...tasks].sort((a,b)=>(a.d||'9').localeCompare(b.d||'9')).forEach(t=>{const r=document.createElement('div');r.className='tk';r.innerHTML='<input type="checkbox"'+(t.x?' checked':'')+'><span class="'+(t.x?'done':'')+'">'+esc(t.t)+'</span><span class="'+(t.d&&t.d<today&&!t.x?'late':'mu')+'">'+(t.d||'')+'</span><b style="cursor:pointer">×</b>';r.firstChild.onchange=e=>{t.x=e.target.checked;LS.s('tasks',tasks);tdr()};r.lastChild.onclick=()=>{tasks=tasks.filter(x=>x!==t);LS.s('tasks',tasks);tdr()};el.appendChild(r)})}
$('#tn').onclick=()=>{const t=$('#ti').value.trim();if(!t)return;tasks.push({t,d:$('#td').value,x:false});LS.s('tasks',tasks);$('#ti').value='';tdr()};$('#ti').onkeydown=e=>{if(e.key==='Enter')$('#tn').click()};tdr();
$$('[data-go]').forEach(b=>b.onclick=()=>{show(b.dataset.go);const e=b.dataset.at&&$('#'+b.dataset.at);if(e)e.scrollIntoView({block:'center'})});
$$('[data-new]').forEach(b=>b.onclick=()=>{mk(b.dataset.new);show('doc')});
LG.forEach(([c,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.l=c;b.onclick=()=>setLang(c);$('#lgs').appendChild(b)});setLang(lang);
</script>
